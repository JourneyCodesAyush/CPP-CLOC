name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Restore cached build artifacts if available
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cpp-cloc-${{ hashFiles('src/**/*.cpp', 'include/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-cpp-cloc-

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++

      # Build and run tests
      - name: Build & Run Tests
        run: |
          make test

  valgrind:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      # Build debug
      - name: Build debug
        run: |
          make

      # Run Valgrind - Debug
      - name: Run Valgrind - Debug
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            ./cloc_cpp .

      # Build release
      - name: Build release
        run: |
          make clean
          make RELEASE=1

      # Run Valgrind - Release
      - name: Run Valgrind - Release
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            ./cloc_cpp .
