name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Restore cached build artifacts if available
      - name: Cache build
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-cpp-cloc-${{ hashFiles('src/**/*.cpp', 'include/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-cpp-cloc-

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++

      # Build and run tests
      - name: Build & Run Tests
        run: |
          make test

  valgrind:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      # Build debug
      - name: Build debug
        run: |
          make

      # Run Valgrind - Debug
      - name: Run Valgrind - Debug
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            ./cloc_cpp .

      # Build release
      - name: Build release
        run: |
          make clean
          make RELEASE=1

      # Run Valgrind - Release
      - name: Run Valgrind - Release
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            ./cloc_cpp .

